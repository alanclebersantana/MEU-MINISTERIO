<!doctype html>
<html lang="pt-BR" data-cor="azul" data-modo="claro" data-tamanho="normal" data-fonte="padrao">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6AC4">
<meta name="description" content="Bíblia, relatório de campo, revisitas, estudo, anotações e check-lists — tudo num só app, com sincronização opcional na nuvem.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ministério">
<meta name="author" content="Alan Correa">
<meta property="og:title" content="Meu Ministério">
<meta property="og:description" content="Bíblia, relatório de campo, revisitas, estudo, anotações e check-lists, com sincronização opcional na nuvem.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<title>Meu Ministério</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== paleta: 6 cores, mesma arquitetura de tokens do Planejar ===== */
html{--acRGB:47,106,196}
html[data-cor=lilas]{--acRGB:122,86,214;--ac-forte:#5B3BB0;--barra:#7A56D6}
html[data-cor=rosa]{--acRGB:206,74,120;--ac-forte:#A93560;--barra:#CE4A78}
html[data-cor=azul]{--acRGB:47,106,196;--ac-forte:#26518F;--barra:#2F6AC4}
html[data-cor=verde]{--acRGB:38,146,98;--ac-forte:#1D6C48;--barra:#269262}
html[data-cor=ambar]{--acRGB:198,124,32;--ac-forte:#94591A;--barra:#C67C20}
html[data-cor=petroleo]{--acRGB:33,120,134;--ac-forte:#175A64;--barra:#217886}
html{--ac:rgb(var(--acRGB));--ac2:rgba(var(--acRGB),.12);--ac-ink:#fff}
html[data-modo=escuro]{--ac:color-mix(in srgb, rgb(var(--acRGB)) 74%, #ffffff);--ac2:rgba(var(--acRGB),.24);--ac-forte:var(--ac);--ac-ink:#12101a}

/* ===== estilo da letra: além do tamanho, três famílias à escolha ===== */
html[data-fonte=classica]{--fd:Georgia,'Times New Roman',serif;--ff:Georgia,'Times New Roman',serif;--fu:Georgia,'Times New Roman',serif}
html[data-fonte=arredondada]{--fd:'Quicksand',system-ui,sans-serif;--ff:'Quicksand',system-ui,sans-serif;--fu:'Quicksand',system-ui,sans-serif}

/* ===== claro / escuro ===== */
html[data-modo=claro]{
  --bg:#F2F4F7;--surf:#FFFFFF;--surf2:#E7EBF0;--ink:#161B22;--ink2:#5B6672;
  --linha:#D8DEE6;--linha-forte:#C2CBD6;--perigo:#C4553F;--ok:#2E9E6B;
  --topo-bg:rgba(242,244,247,.86);--topo-ink:var(--ink);--topo-borda:1px solid var(--linha);
  --escopo-bg:rgba(242,244,247,.92);--escopo-borda:1px solid var(--linha);
  --nav-bg:rgba(255,255,255,.88);--nav-ink:var(--ink);--nav-borda:1px solid var(--linha);
  --toast-bg:#1B222C;--toast-ink:#fff;--leitura-bg:#FBF9F3;--leitura-ink:#26221A;
  --sombra:0 2px 10px rgba(20,25,32,.05);--sombra-alta:0 8px 22px rgba(20,25,32,.12);
  --btn-sombra:0 2px 8px rgba(var(--acRGB),.35);--hover:rgba(20,25,32,.05);--marca-bg:var(--ac2);--marca-ink:var(--ac-forte);
}
html[data-modo=escuro]{
  --bg:#10151C;--surf:#1A212B;--surf2:#212A36;--ink:#EDEFF3;--ink2:#98A2AD;
  --linha:#2B3540;--linha-forte:#3A4552;--perigo:#E27C68;--ok:#5FBE93;
  --topo-bg:rgba(16,21,28,.86);--topo-ink:var(--ink);--topo-borda:1px solid var(--linha);
  --escopo-bg:rgba(16,21,28,.92);--escopo-borda:1px solid var(--linha);
  --nav-bg:rgba(26,33,43,.88);--nav-ink:var(--ink);--nav-borda:1px solid var(--linha);
  --toast-bg:#EDEFF3;--toast-ink:#161B22;--leitura-bg:#161B22;--leitura-ink:#EDEFF3;
  --sombra:0 2px 10px rgba(0,0,0,.28);--sombra-alta:0 10px 26px rgba(0,0,0,.4);
  --btn-sombra:0 2px 10px rgba(0,0,0,.4);--hover:rgba(255,255,255,.06);--marca-bg:var(--ac2);--marca-ink:var(--ac);
}
html{--ff:'Nunito',system-ui,sans-serif;--fd:'Fraunces',Georgia,serif;--fu:'Nunito',system-ui,sans-serif;
  --f-leitura:Georgia,'Times New Roman',serif;
  --r:18px;--r2:12px;--r-ico:12px;--r-folha:20px;
  --borda:1px solid var(--linha);--borda-fina:1px solid var(--linha);--borda-tracejada:1px dashed var(--linha-forte);
  --nav-h:0px;--topo-h:56px}

/* ===== base estrutural ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html[data-tamanho="grande"]{font-size:17.5px}
html[data-tamanho="maior"]{font-size:19.5px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);
  font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.travado{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:1.15}
p{margin:0}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- casca ---- */
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--topo-bg);color:var(--topo-ink);
  border-bottom:var(--topo-borda);backdrop-filter:blur(10px)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-ico);flex:none}
.marca-ico svg{width:34px;height:34px}
.marca-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.marca-txt b{font-family:var(--fd);font-size:1.06rem;letter-spacing:.005em}
.marca-txt small{font-size:.68rem;opacity:.7;font-family:var(--fu);letter-spacing:.08em;text-transform:uppercase}
.topo-acoes{display:flex;gap:4px}
.ico{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r-ico);color:inherit}
.ico svg{width:21px;height:21px}
.ico:hover{background:var(--hover)}

.vista{flex:1;padding:18px 16px 28px;max-width:760px;width:100%;margin:0 auto}
.vista.anima-esq{animation:entraDaDireita .24s ease}
.vista.anima-dir{animation:entraDaEsquerda .24s ease}
@keyframes entraDaDireita{from{transform:translateX(26px);opacity:.25}to{transform:none;opacity:1}}
@keyframes entraDaEsquerda{from{transform:translateX(-26px);opacity:.25}to{transform:none;opacity:1}}

/* ---- textos e cabeçalhos ---- */
.eyebrow{font-family:var(--fu);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.saudacao{margin-bottom:20px}
.saudacao h1{font-size:1.8rem;margin:4px 0 6px}
.saudacao .sub{font-size:.92rem;opacity:.75}
.cabeca{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cabeca h1{font-size:1.55rem}
.grupo{font-family:var(--fu);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin:22px 0 8px}
.secao{margin-top:26px}
.secao-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.secao-topo h2{font-size:1.1rem}
.link{color:var(--ac);font-size:.82rem;font-weight:600}
.meta{font-family:var(--fu);font-size:.75rem;opacity:.6}
.meta.alerta{color:var(--perigo);opacity:1;font-weight:600}
.dica{font-size:.8rem;opacity:.6;margin-top:6px}
.credito{margin-top:24px;text-align:center;font-size:.72rem;opacity:.45;font-family:var(--fu)}
.voltar-cat{font-family:var(--fu);font-size:.82rem;font-weight:700;color:var(--ac);margin-bottom:14px;display:inline-flex;align-items:center;gap:4px}

/* ---- botões ---- */
.btn{padding:11px 18px;border-radius:var(--r2);background:var(--ac);color:var(--ac-ink);font-weight:700;font-size:.9rem;
  box-shadow:var(--btn-sombra);transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surf);color:var(--ink);border:var(--borda);box-shadow:none}
.btn.perigo,.btn.ghost.perigo{color:var(--perigo)}
.btn.perigo{background:var(--perigo);color:#fff}
.btn.ghost.perigo{background:var(--surf)}
.btn.mini{padding:7px 13px;font-size:.8rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--surf2);border:var(--borda);font-size:.8rem;font-family:var(--fu)}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.linha-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

/* ---- KPI ---- */
.grade-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:12px 8px;border-radius:var(--r);background:var(--surf);border:var(--borda);text-align:center;box-shadow:var(--sombra)}
.kpi b{display:block;font-family:var(--fd);font-size:1.5rem;color:var(--ac);line-height:1}
.kpi span{display:block;margin-top:4px;font-size:.66rem;opacity:.6;font-family:var(--fu);line-height:1.25}
@media (max-width:400px){.grade-kpi{grid-template-columns:repeat(2,1fr)}}

/* ---- tira da semana ---- */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{padding:9px 2px 7px;border-radius:var(--r2);background:var(--surf);border:var(--borda);display:flex;flex-direction:column;align-items:center;gap:2px}
.dia .ds{font-family:var(--fu);font-size:.6rem;opacity:.5;text-transform:uppercase}
.dia .dn{font-family:var(--fd);font-size:1.02rem;font-weight:700}
.dia .pontos{display:flex;gap:2px;height:5px}
.dia .pontos i{width:4px;height:4px;border-radius:50%;background:var(--ac)}
.dia.hoje{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.dia.cheio{background:var(--ac2)}

/* ---- nome editável na saudação ---- */
.nome-edit{font:inherit;color:var(--ac);border-bottom:2px dotted var(--ac);padding:0 2px;line-height:1}
.nome-edit.vazio{font-family:var(--fu);font-size:.8rem;font-weight:600;border:1px dashed var(--ac);
  border-radius:999px;padding:4px 12px;vertical-align:middle;margin-left:4px}

/* ---- atalhos e avisos ---- */
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.atalho{padding:14px;border-radius:var(--r);background:var(--surf);border:var(--borda);text-align:left;box-shadow:var(--sombra)}
.atalho b{display:block;font-size:.92rem}
.atalho span{font-size:.74rem;opacity:.55;font-family:var(--fu)}
.aviso{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r);
  background:var(--ac2);color:var(--ac-forte);margin-bottom:14px}
.aviso p{font-size:.84rem}

/* ---- agenda: pontos e legenda ---- */
.cel .pontos{display:flex;gap:2px;height:5px}
.cel .pontos i{width:4px;height:4px;border-radius:50%}
.cel i.p1{background:var(--ac)}
.cel i.p2{background:var(--perigo)}
.cel i.p3{background:var(--ok)}
.cel.sel{background:var(--ac);color:var(--ac-ink)}
.cel.sel i{background:var(--ac-ink)!important}
.legenda{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-family:var(--fu);font-size:.7rem;opacity:.6}
.legenda span{display:flex;align-items:center;gap:5px}
.legenda i{width:6px;height:6px;border-radius:50%;display:inline-block}
.legenda i.p1{background:var(--ac)}.legenda i.p2{background:var(--perigo)}.legenda i.p3{background:var(--ok)}

/* ---- cartões ---- */
.cartao{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surf);
  border:var(--borda);box-shadow:var(--sombra);margin-bottom:9px;text-align:left;width:100%;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease}
.cartao:hover{transform:translateY(-1px);box-shadow:var(--sombra-alta)}
.cartao-txt{flex:1;min-width:0}
.cartao h3{font-size:.98rem;font-family:var(--ff);font-weight:650;margin-bottom:2px}
.cartao .trecho{font-size:.82rem;opacity:.6;margin-top:3px}
.selo{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--ac2);color:var(--ac-forte);
  font-family:var(--fu);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.selo.atraso{background:rgba(196,85,63,.14);color:var(--perigo)}

/* ---- vazio ---- */
.vazio{padding:32px 16px;text-align:center;border-radius:var(--r);background:var(--surf);border:var(--borda-tracejada)}
.vazio h3{font-size:1.1rem;margin-bottom:6px}
.vazio p{font-size:.86rem;opacity:.65;margin-bottom:14px}
.vazio.compacto{padding:18px 14px}

/* ---- folha (modal) ---- */
.folha{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.folha.open{display:flex}
.folha-card{width:100%;max-width:640px;max-height:94vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:var(--r-folha) var(--r-folha) 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  animation:sobe .22s ease}
@keyframes sobe{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.folha-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;border-bottom:var(--borda-fina)}
.folha-topo h2{font-size:1.12rem}
.folha-corpo{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.folha-rodape{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:var(--borda-fina);background:var(--surf2);flex-wrap:wrap}
@media (min-width:700px){.folha{align-items:center}.folha-card{border-radius:var(--r-folha);max-height:88vh}}

/* ---- formulário ---- */
.form{display:flex;flex-direction:column;gap:14px}
.bloco{display:flex;flex-direction:column;gap:6px}
.rotulo{font-family:var(--fu);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
.form input[type=text],.form input[type=date],.form input[type=time],.form input[type=number],.form input[type=email],.form input[type=password],.form input[type=search],.form input[type=datetime-local],.form select,.form textarea{
  width:100%;padding:10px 13px;border-radius:var(--r2);border:var(--borda);background:var(--surf);color:var(--ink);font-size:.94rem;
  -webkit-appearance:none;appearance:none;color-scheme:light dark}
.form textarea{resize:vertical;line-height:1.5;font-family:var(--ff)}
.form input[type=number]::-webkit-outer-spin-button,.form input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form input[type=number]{-moz-appearance:textfield}
.form select{
  padding-right:34px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6672' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px}
.form input[type=date],.form input[type=time],.form input[type=datetime-local]{color-scheme:light dark}
html[data-modo=escuro] .form input,html[data-modo=escuro] .form select,html[data-modo=escuro] .form textarea{color-scheme:dark}
html[data-modo=claro] .form input,html[data-modo=claro] .form select,html[data-modo=claro] .form textarea{color-scheme:light}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.dupla{grid-template-columns:1fr}}
.troca{display:flex;align-items:center;gap:10px;font-size:.9rem}
.troca input{width:20px;height:20px;accent-color:var(--ac)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu>button{text-align:left;padding:12px 14px;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-size:.92rem}
.menu>button b{display:block}
.menu>button span{display:block;font-size:.76rem;opacity:.55;font-family:var(--fu)}
.menu>button.on{border-color:var(--ac);background:var(--ac2)}
.menu>button.perigo{color:var(--perigo)}
.linha-gerencia{display:flex;gap:6px;align-items:stretch}
.linha-gerencia>button:first-child{flex:1;text-align:left;padding:12px 14px;border-radius:var(--r2);background:var(--surf);border:var(--borda)}
.linha-gerencia>button:first-child b{display:block;font-size:.92rem}
.linha-gerencia>button:first-child span{display:block;font-size:.75rem;opacity:.55;font-family:var(--fu)}
.cores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cor{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-size:.82rem}
.cor i{width:18px;height:18px;border-radius:50%;flex:none}
.cor.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.cor[data-cor=lilas] i{background:#7A56D6}.cor[data-cor=rosa] i{background:#D6567A}.cor[data-cor=azul] i{background:#3E6FD6}
.cor[data-cor=verde] i{background:#2E9E6B}.cor[data-cor=ambar] i{background:#D98A2B}.cor[data-cor=petroleo] i{background:#2B7E8E}

/* ---- checklists ---- */
.lista{flex-direction:column;align-items:stretch;cursor:default}
.lista-topo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lista-topo h3{flex:1;cursor:pointer}
.prog{position:relative;width:52px;height:5px;border-radius:99px;background:var(--surf2);overflow:hidden;flex:none}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:99px}
.pc{font-family:var(--fu);font-size:.72rem;opacity:.55;flex:none}
.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.itens li{display:flex;align-items:center;gap:9px;padding:6px 2px}
.itens li span{flex:1;font-size:.9rem;cursor:pointer}
.itens li.feito span{opacity:.45;text-decoration:line-through}
.marcador{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--linha-forte);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--ac-ink)}
.itens li.feito .marcador{background:var(--ac);border-color:var(--ac)}
.add-item{display:flex;gap:8px;margin-top:10px}
.add-item input{flex:1;padding:8px 12px;border-radius:var(--r2);border:var(--borda);background:var(--surf2);font-size:.86rem}

/* ---- bíblia ---- */
.marcador-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--ac2);border:1px solid transparent;margin-bottom:18px}
.marcador-card .icobiblia{flex:none;width:42px;height:42px;border-radius:var(--r2);background:var(--surf);display:grid;place-items:center;color:var(--ac)}
.marcador-card .icobiblia svg{width:22px;height:22px}
.marcador-card .txt{flex:1;min-width:0}
.marcador-card .txt .rot{font-family:var(--fu);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;opacity:.6}
.marcador-card .txt h3{font-size:1.15rem;margin-top:2px}
.busca{margin-bottom:14px}
.busca input{width:100%;padding:11px 14px;border-radius:var(--r2);border:var(--borda);background:var(--surf);font-size:.92rem}
.livros{display:flex;flex-direction:column;gap:5px}
.livro-btn{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-size:.92rem;font-weight:600}
.livro-btn span.n{opacity:.4;font-family:var(--fu);font-weight:400;font-size:.78rem}
.caps-grade{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
@media (max-width:420px){.caps-grade{grid-template-columns:repeat(5,1fr)}}
.cap-btn{aspect-ratio:1;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-family:var(--fu);font-weight:700;font-size:.92rem;display:grid;place-items:center}
.cap-btn.marcado{border-color:var(--ac);border-width:2px;color:var(--ac)}
.cap-btn.lido{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.cap-btn.lido.marcado{background:var(--ac);color:var(--ac-ink);border-color:var(--ac-ink)}

/* ---- calendário (relatório) ---- */
.mes-topo{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mes-topo h2{font-size:1.15rem}
.calendario{background:var(--surf);border:var(--borda);border-radius:var(--r);padding:12px;box-shadow:var(--sombra)}
.cal-cab{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-cab span{text-align:center;font-family:var(--fu);font-size:.62rem;opacity:.5;text-transform:uppercase}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cel{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent}
.cel:hover{background:var(--surf2)}
.cel .n{font-size:.86rem}
.cel.hoje .n{color:var(--ac);font-weight:800}
.cel.cheio{background:var(--ac2)}
.cel.cheio .n{font-weight:700}
.cel.fora{visibility:hidden}
.cel .h{font-family:var(--fu);font-size:.56rem;opacity:.55}
.cel.n1{background:var(--ac2)}
.cel.n2{background:color-mix(in srgb, var(--ac) 45%, var(--ac2))}
.cel.n3{background:color-mix(in srgb, var(--ac) 70%, var(--ac2))}
.cel.n4{background:var(--ac)}
.cel.n3 .n,.cel.n4 .n,.cel.n3 .h,.cel.n4 .h{color:var(--ac-ink)}
.cel.sel .n,.cel.sel .h{color:var(--ac-ink)!important}
.escala{display:flex;align-items:center;gap:5px;font-family:var(--fu);font-size:.66rem;opacity:.6;margin:10px 0;flex-wrap:wrap}
.escala i{width:14px;height:9px;border-radius:3px;background:var(--surf2);flex:none}
.escala i.n1{background:var(--ac2)}
.escala i.n2{background:color-mix(in srgb, var(--ac) 45%, var(--ac2))}
.escala i.n3{background:color-mix(in srgb, var(--ac) 70%, var(--ac2))}
.escala i.n4{background:var(--ac)}

/* ---- relatório de campo: anel, ano de serviço, gráfico, créditos ---- */
.anelbox{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--surf);border:var(--borda);box-shadow:var(--sombra);margin-bottom:10px}
.anel-svg{width:84px;height:84px;flex:none}
.anel-trilho{fill:none;stroke:var(--surf2);stroke-width:7}
.anel-marca{fill:none;stroke:var(--ac);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .3s ease}
.anelinfo{flex:1;min-width:0}
.anel-total{font-family:var(--fd);font-size:1.6rem;font-weight:700;line-height:1.15;margin-top:2px}
.bar{position:relative;height:8px;border-radius:99px;background:var(--surf2);overflow:hidden;margin:10px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:99px;transition:width .3s ease}
.ano-box{padding:14px;border-radius:var(--r);background:var(--ac2);margin-bottom:6px}
.contador{display:flex;align-items:center;gap:8px}
.contador button{width:34px;height:34px;border-radius:var(--r2);background:var(--surf2);font-weight:800;font-size:1.1rem;flex:none}
.contador input{width:100%;text-align:center}
.graf{display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 2px 0}
.graf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.graf-col i{width:100%;max-width:20px;border-radius:4px 4px 0 0;background:var(--surf2)}
.graf-col.atual i{background:var(--ac)}
.graf-col .valor{font-family:var(--fu);font-size:.56rem;opacity:.6;white-space:nowrap}
.graf-col .graf-mes{font-family:var(--fu);font-size:.62rem;opacity:.55;text-transform:uppercase}
.obs-linha{display:flex;gap:8px;align-items:center;margin-top:8px}
.obs-linha input[type=date]{max-width:130px;flex:none}
.ico.mini{width:30px;height:30px}

/* ---- leitura ---- */
.leitura{position:fixed;inset:0;z-index:70;background:var(--leitura-bg);color:var(--leitura-ink);display:none;overflow:auto}
.leitura.open{display:block}
.leitura-topo{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--leitura-bg);border-bottom:var(--borda-fina)}
.leitura-tam{display:flex;gap:6px}
.leitura-tam button{padding:6px 12px;border-radius:999px;border:var(--borda);font-family:var(--fu);font-size:.8rem}
.leitura-corpo{max-width:640px;margin:0 auto;padding:24px 20px 80px}
.leitura-corpo h1{font-size:1.7rem;margin:6px 0 16px}
.leitura-corpo .texto{font-size:1.05rem;line-height:1.75;font-family:var(--f-leitura)}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  z-index:80;display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:999px;background:var(--toast-bg);
  color:var(--toast-ink);font-size:.86rem;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--ac2);font-weight:700;font-size:.86rem}

/* ---- conta / sincronização ---- */
.conta-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surf);border:var(--borda);margin-bottom:14px}
.conta-avatar{width:38px;height:38px;border-radius:50%;background:var(--ac2);color:var(--ac-forte);display:grid;place-items:center;font-weight:800;flex:none}
.conta-txt{flex:1;min-width:0}
.conta-txt b{display:block;font-size:.92rem}
.conta-txt span{display:block;font-size:.76rem;opacity:.6;font-family:var(--fu)}
.pt-sync{display:inline-flex;align-items:center;gap:5px;font-family:var(--fu);font-size:.68rem;font-weight:700}
.pt-sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pt-sync.off i{background:var(--ink2)}
.linha-divisoria{border:0;border-top:var(--borda-fina);margin:6px 0}

/* =====================================================================
   LAYOUT 2.0 — menu inferior, Relatório como tela inicial (calendário),
   crédito de horas destacado, lembretes minimalistas.
   ===================================================================== */
html{--nav-alt:68px;--cr:#C67C20;--cr2:rgba(198,124,32,.15);--cr-forte:#94591A}
html[data-cor=ambar]{--cr:#7A56D6;--cr2:rgba(122,86,214,.15);--cr-forte:#5B3BB0}
html[data-modo=escuro]{--cr:#E3A04F;--cr2:rgba(227,160,79,.2);--cr-forte:#F0B66E}
html[data-modo=escuro][data-cor=ambar]{--cr:#A88BF0;--cr2:rgba(168,139,240,.22);--cr-forte:#C3B2FF}
.app{padding-bottom:calc(var(--nav-alt) + 22px + env(safe-area-inset-bottom))}
.vista{padding-top:calc(16px + env(safe-area-inset-top))}
.toast{bottom:calc(var(--nav-alt) + 14px + env(safe-area-inset-bottom))}

/* menu inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--nav-alt) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);
  background:var(--nav-bg);border-top:var(--nav-borda);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink2);font-family:var(--fu);font-size:.66rem;font-weight:800;letter-spacing:.01em}
.nav button .pil{display:grid;place-items:center;width:54px;height:29px;border-radius:999px;transition:background .15s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ac-forte)}
.nav button.on .pil{background:var(--ac2)}
.nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.nbadge{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--perigo);color:#fff;font-style:normal;font-size:.62rem;font-weight:900;display:grid;place-items:center;line-height:1}
.nbadge:empty{display:none}
@media (min-width:760px){.nav{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:14px;border-radius:22px;
  border:var(--nav-borda);box-shadow:var(--sombra-alta);height:var(--nav-alt);padding:0 6px}}

/* cabeçalho de cada tela */
.vtopo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vtopo h1{font-size:1.75rem;margin-top:3px}
.vtopo-acoes{display:flex;gap:8px}
.ico-r{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surf);border:var(--borda);box-shadow:var(--sombra);color:var(--ink)}
.ico-r svg{width:20px;height:20px}

/* relatório: resumo com barra empilhada campo + crédito */
.r-resumo{padding:16px;border-radius:var(--r);background:var(--surf);border:var(--borda);box-shadow:var(--sombra);margin-bottom:12px}
.meta-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--ac2);color:var(--ac-forte);
  font-family:var(--fu);font-size:.74rem;font-weight:800;margin-bottom:10px}
.meta-pill u{opacity:.7;text-underline-offset:2px}
.r-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.r-num{display:block;font-family:var(--fd);font-size:2.5rem;line-height:1;letter-spacing:-.02em}
.r-pct{font-family:var(--fd);font-size:1.25rem;color:var(--ac-forte)}
.pilha{display:flex;height:12px;border-radius:99px;background:var(--surf2);overflow:hidden;margin:12px 0 10px}
.pilha i{display:block;height:100%;transition:width .35s ease}
.pilha .pc{background:var(--ac)}
.pilha .pr{background:repeating-linear-gradient(-45deg,var(--cr) 0 5px,color-mix(in srgb,var(--cr) 55%,#fff) 5px 10px)}
.leg3{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--fu);font-size:.78rem;color:var(--ink2);font-weight:700}
.leg3 b{color:var(--ink)}
.leg3 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg3 i.pc{background:var(--ac)}.leg3 i.pr{background:var(--cr)}
.leg-falta{margin-left:auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.duo .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;font-size:.88rem}
.duo .btn svg{width:18px;height:18px;flex:none}
.btn.btn-cred{background:var(--cr);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--cr) 35%,transparent)}
html[data-modo=escuro] .btn.btn-cred{color:#17120a}
.btn.btn-cred.off{background:var(--surf2);color:var(--ink2);box-shadow:none}
.r-cal{margin-bottom:12px}
.r-cal .mes-topo{margin:0 0 8px}
.r-cal .escala{margin:10px 0 0}
.cel{position:relative}
.cel.futuro .n{opacity:.45}
.cel.hoje{box-shadow:inset 0 0 0 2px var(--ink)}
.cel.tem-cred:after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--cr);box-shadow:0 0 0 1.5px var(--surf)}
.escala .lg-cred{display:inline-flex;align-items:center;gap:5px;margin-right:auto}
.escala .lg-cred b{width:8px;height:8px;border-radius:50%;background:var(--cr);display:inline-block}
.escala .vazio-esq{margin-right:auto}

/* cartão de crédito de horas */
.credcard{padding:16px;border-radius:var(--r);background:var(--surf);border:1.5px solid var(--cr2);box-shadow:var(--sombra);margin-bottom:12px}
.credcard.bloq{border:var(--borda-tracejada)}
.cc-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.cc-top b{font-size:.98rem}
.cc-top .meta{display:block;line-height:1.35;margin-top:2px;opacity:.75}
.cc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cr2);color:var(--cr-forte);flex:none}
.cc-ic svg{width:20px;height:20px}
.credcard.bloq .cc-ic{background:var(--surf2);color:var(--ink2)}
.cc-tot{font-family:var(--fd);font-size:1.35rem;color:var(--cr-forte);white-space:nowrap}
.cc-cat{border-top:var(--borda-fina);padding:10px 0 4px}
.cc-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tag-cred{font-family:var(--fu);font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--cr2);color:var(--cr-forte)}
.cc-l{display:flex;align-items:center;gap:10px;font-size:.85rem;padding:3px 0}
.cc-l .cc-dia{flex:1;text-align:left;opacity:.7}
.cc-x{width:28px;height:28px;border-radius:9px;background:var(--surf2);font-size:.75rem;opacity:.75}
.duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-card{padding:14px;border-radius:var(--r);background:var(--surf);border:var(--borda);box-shadow:var(--sombra);display:flex;flex-direction:column;gap:8px}
.mini-card b{font-family:var(--fd);font-size:1.6rem;line-height:1}
.mini-card .contador button{flex:1}

/* folha de lançamento (campo / crédito) */
.modo{display:grid;grid-template-columns:1fr 1fr;background:var(--surf2);border-radius:14px;padding:4px}
.modo button{padding:10px 6px;border-radius:11px;font-weight:800;font-size:.86rem;opacity:.7}
.modo button.on{background:var(--ac);color:var(--ac-ink);opacity:1}
.modo button.on.cr{background:var(--cr);color:#fff}
.modo button.dis{opacity:.4}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{text-align:left;padding:10px 12px;border-radius:14px;background:var(--surf);border:1.5px solid var(--linha)}
.cats button b{display:block;font-size:.9rem}
.cats button small{display:block;font-family:var(--fu);font-size:.7rem;opacity:.65;line-height:1.25;margin-top:2px}
.cats button.on{border-color:var(--cr);background:var(--cr2)}
.passo{display:flex;align-items:center;justify-content:center;gap:16px}
.passo button{width:50px;height:50px;border-radius:16px;background:var(--surf2);font-size:1.5rem;font-weight:800}
.passo b{font-family:var(--fd);font-size:2.6rem;min-width:110px;text-align:center}
.segm4{display:flex;gap:6px}
.segm4 button{flex:1;padding:10px 0;border-radius:12px;background:var(--surf2);font-weight:800;font-size:.84rem}
.segm4 button.on{background:var(--ac);color:var(--ac-ink)}
.segm4.cr button.on{background:var(--cr);color:#fff}
.nota-cred{font-size:.82rem;padding:9px 12px;border-radius:var(--r2);background:var(--cr2);color:var(--cr-forte)}
.dia-l{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:var(--borda-fina)}
.dia-l:last-of-type{border-bottom:0}
.dl-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.dl-ic svg{width:19px;height:19px}
.dl-ic.campo{background:var(--ac2);color:var(--ac-forte)}.dl-ic.cred{background:var(--cr2);color:var(--cr-forte)}

/* revisitas e estudos */
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.filtros::-webkit-scrollbar{display:none}
.filtros .chip{flex:none;font-weight:700;padding:8px 14px}
.pess{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--surf);border:var(--borda);
  box-shadow:var(--sombra);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--ac2);color:var(--ac-forte);font-weight:900;font-size:.92rem;font-family:var(--fu)}
.pess-tx{flex:1;min-width:0}
.pess-l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pess h3{font-family:var(--ff);font-size:1rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pess .trecho{font-size:.82rem;opacity:.65;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pess .ult{font-size:.8rem;opacity:.6;margin-top:5px;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.estado{flex:none;font-family:var(--fu);font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--surf2);opacity:.85;white-space:nowrap}
.estado.venc{background:rgba(196,85,63,.14);color:var(--perigo);opacity:1}
.estado.sem{background:var(--ac2);color:var(--ac-forte);opacity:1}
.pess-acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini-b{padding:7px 12px;border-radius:10px;font-size:.78rem;font-weight:800;background:var(--surf2);font-family:var(--fu)}
.mini-b.pri{background:var(--ac2);color:var(--ac-forte)}

/* lembretes */
.segm{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surf2);border-radius:12px;padding:4px;margin-bottom:4px}
.segm button{padding:8px;border-radius:9px;font-size:.84rem;font-weight:800;opacity:.65}
.segm button.on{background:var(--surf);opacity:1;box-shadow:var(--sombra)}
.lc{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 0;border-radius:var(--r);background:var(--surf);border:var(--borda);
  box-shadow:var(--sombra);margin-bottom:8px;overflow:hidden;cursor:pointer;width:100%;text-align:left}
.lc-faixa{width:5px;align-self:stretch;border-radius:0 4px 4px 0;background:var(--ac);flex:none}
.lc-faixa.atras{background:var(--perigo)}.lc-faixa.feito{background:var(--linha)}
.lc-hora{font-family:var(--fu);font-weight:900;font-size:.95rem;width:46px;flex:none}
.lc-tx{flex:1;min-width:0}
.lc-tx h3{font-family:var(--ff);font-size:.95rem;font-weight:700;margin:0}
.lc.feito .lc-tx h3,.lc.feito .lc-hora{opacity:.45}.lc.feito .lc-tx h3{text-decoration:line-through}
.lc-ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--linha-forte);display:grid;place-items:center;flex:none;color:var(--ac-ink)}
.lc-ck.on{background:var(--ac);border-color:var(--ac)}
.lc-ck svg{width:15px;height:15px}
.grupo.alerta{color:var(--perigo);opacity:1}

/* mais */
.grade-mais{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:var(--surf);border:var(--borda);box-shadow:var(--sombra);text-align:left}
.tile .tic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac2);color:var(--ac-forte)}
.tile .tic svg{width:21px;height:21px}
.tile b{display:block;font-size:.95rem}
.tile small{display:block;font-family:var(--fu);font-size:.74rem;opacity:.6}
</style>
</head>

</div>

<div id="folha" class="folha"></div>
<div id="leitura" class="leitura"></div>

  /* =======================================================================
     MINISTÉRIO — hub com Relatório de Campo, Revisitas e Estudo
     Portado do Caderno — Meu Estudo Pessoal, com todos os campos e cálculos
     originais: metas de pioneiro, créditos e abonos, ano de serviço,
     gráfico de 12 meses e mensagem de relatório para o WhatsApp.
     ======================================================================= */
  var relMes = hojeISO().slice(0, 7); // 'AAAA-MM'
  var revFiltro = 'retorno';
  var obsEstudoTmp = [];

  var METAS = [
    ['', 'Sem meta', 0],
    ['campanha', 'Pioneiro Auxiliar Campanha — 15 h', 15],
    ['auxiliar', 'Pioneiro Auxiliar — 30 h', 30],
    ['regular', 'Pioneiro Regular — 50 h', 50],
    ['especial', 'Pioneiro Especial — 100 h', 100]
  ];
  var CATS_CREDITO = [['escola', 'Escola'], ['ldc', 'LDC'], ['construcao', 'Construção'], ['outro', 'Outros']];

  /* ---- Relatório de Campo: dados (registros achatados: d_/est_/cred_/config) ---- */
  function relAtivos() { return D.relatorio.filter(function (x) { return !x.del; }); }
  function relBusca(id) { var a = relAtivos().filter(function (x) { return x.id === id; }); return a[0] || null; }
  function relSalva(rec) { D.relatorio = D.relatorio.filter(function (x) { return x.id !== rec.id; }).concat(rec); salva(); }
  function relConfig() { return relBusca('config') || { id: 'config', meta: '', credCats: [], credNomeOutro: '' }; }
  function relCatsAtivas() { var c = relConfig(); return Array.isArray(c.credCats) ? c.credCats : []; }
  function relNomeCategoria(catId) {
    if (catId === 'outro') return (relConfig().credNomeOutro || '').trim() || 'Outros';
    var f = CATS_CREDITO.filter(function (c) { return c[0] === catId; })[0];
    return f ? f[1] : catId;
  }
  function relAtualizaConfig(patch) {
    var atual = relConfig();
    var novo = { id: 'config', meta: atual.meta || '', credCats: relCatsAtivas(), credNomeOutro: atual.credNomeOutro || '' };
    Object.keys(patch).forEach(function (k) { novo[k] = patch[k]; });
    novo.updatedAt = agoraMs();
    relSalva(novo);
  }
  function idDiaRel(iso) { return 'd_' + iso; }
  function minDoDia(iso) { var r = relBusca(idDiaRel(iso)); return r ? Number(r.minutos) || 0 : 0; }
  function creditosDoDia(r) { return (r && r.creditos) || {}; }
  function idEstudosMes(mes) { return 'est_' + mes; }
  function estudosDoMes(mes) { var r = relBusca(idEstudosMes(mes)); return r ? Number(r.quantidade) || 0 : 0; }
  function idCredMes(catId, mes) { return 'cred_' + catId + '_' + mes; }
  function credManualDoMes(catId, mes) { var r = relBusca(idCredMes(catId, mes)); return r ? Number(r.minutos) || 0 : 0; }
  function creditoDiasDoMes(catId, mes) {
    return relAtivos().filter(function (r) { return r.id.indexOf('d_') === 0 && (r.data || '').slice(0, 7) === mes; })
      .reduce(function (t, r) { return t + (Number(creditosDoDia(r)[catId]) || 0); }, 0);
  }
  function creditoTotalDoMes(catId, mes) { return credManualDoMes(catId, mes) + creditoDiasDoMes(catId, mes); }
  function metaTemCredito(cod) { return cod === 'regular' || cod === 'especial'; }
  function fmtMin(min) {
    min = Number(min) || 0; var h = Math.floor(min / 60), m = min % 60;
    if (!m) return h + 'h'; if (!h) return m + 'min'; return h + 'h' + String(m).padStart(2, '0');
  }
  function minutosDoMes(mes) {
    return relAtivos().filter(function (r) { return r.id.indexOf('d_') === 0 && (r.data || '').slice(0, 7) === mes; })
      .reduce(function (t, r) { return t + (Number(r.minutos) || 0); }, 0);
  }
  function anoDeServico(mes) {
    var p = mes.split('-').map(Number), a = p[0], m = p[1];
    var inicio = m >= 9 ? a : a - 1;
    return { inicio: inicio, fim: inicio + 1, rotulo: 'Ano de serviço ' + inicio + '/' + (inicio + 1) };
  }
  function mesesDoAno(mesRef) {
    var av = anoDeServico(mesRef), arr = [], a = av.inicio, m = 9;
    for (var i = 0; i < 12; i++) { arr.push(a + '-' + String(m).padStart(2, '0')); m++; if (m > 12) { m = 1; a++; } }
    return arr;
  }
  function minutosDoAno(mes) {
    var av = anoDeServico(mes), de = av.inicio + '-09-01', ate = av.fim + '-08-31';
    return relAtivos().filter(function (r) { return r.id.indexOf('d_') === 0 && r.data >= de && r.data <= ate; })
      .reduce(function (t, r) { return t + (Number(r.minutos) || 0); }, 0);
  }
  function creditoMinutosDoAno(mesRef) {
    var cats = relCatsAtivas();
    return mesesDoAno(mesRef).reduce(function (t, mes) {
      return t + cats.reduce(function (s, cid) { return s + creditoTotalDoMes(cid, mes); }, 0);
    }, 0);
  }
  function mesesRestantes(mes) {
    var p = mes.split('-').map(Number), a = p[0], m = p[1];
    var av = anoDeServico(mes);
    return (av.fim * 12 + 8) - (a * 12 + m) + 1;
  }

  function fmtHM(min) { min = Number(min) || 0; return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); }
  var DIAS_LONGOS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  function diaLongo(iso) { var p = iso.split('-'); return DIAS_LONGOS[new Date(p[0], p[1] - 1, p[2]).getDay()]; }
  var DESC_CAT = { escola: 'Escola de pioneiro e outras escolas teocráticas', ldc: 'Depto. Local de Projeto e Construção', construcao: 'Salão do Reino, Salão de Assembleias', outro: 'Outra designação aprovada' };

  /* resumo do mês: campo, crédito (só conta com meta de Regular/Especial) e meta */
  function relResumo(mes) {
    var cod = relConfig().meta || '', credOn = metaTemCredito(cod);
    var mt = METAS.filter(function (m) { return m[0] === cod; })[0] || ['', 'Sem meta', 0];
    var campoMin = minutosDoMes(mes);
    var partes = relCatsAtivas().map(function (cid) { return [cid, creditoTotalDoMes(cid, mes)]; }).filter(function (p) { return p[1] > 0; });
    var cred = credOn ? partes.reduce(function (t, p) { return t + p[1]; }, 0) : 0;
    return { cod: cod, nome: mt[1].split(' — ')[0], horas: mt[2], alvo: mt[2] * 60, credOn: credOn, campo: campoMin, cred: cred, partes: partes, total: campoMin + cred };
  }
  function credLiberado() { return metaTemCredito(relConfig().meta || ''); }
  function credDoDiaAtivo(rec) {
    if (!rec) return 0; var c = creditosDoDia(rec);
    return relCatsAtivas().reduce(function (t, cid) { return t + (Number(c[cid]) || 0); }, 0);
  }
  /* cada lançamento de crédito do mês: um por dia/categoria, mais o total manual antigo (sem dia) */
  function entradasCredito(mes) {
    var ativas = relCatsAtivas(), out = [];
    ativas.forEach(function (cid) { var man = credManualDoMes(cid, mes); if (man) out.push({ cat: cid, iso: '', min: man }); });
    relAtivos().filter(function (r) { return r.id.indexOf('d_') === 0 && (r.data || '').slice(0, 7) === mes; }).forEach(function (r) {
      var c = creditosDoDia(r);
      Object.keys(c).forEach(function (cid) { var v = Number(c[cid]) || 0; if (v > 0 && ativas.indexOf(cid) >= 0) out.push({ cat: cid, iso: r.data, min: v }); });
    });
    var ordemCat = CATS_CREDITO.map(function (c) { return c[0]; });
    return out.sort(function (a, b) { return ordemCat.indexOf(a.cat) - ordemCat.indexOf(b.cat) || (a.iso || '').localeCompare(b.iso || ''); });
  }

  function cartaoCredito(R) {
    if (!R.credOn) {
      return '<section class="credcard bloq"><div class="cc-top"><span class="cc-ic">' + sv(ICO.mais) + '</span><div><b>Crédito de horas</b>' +

        '<button class="btn ghost" style="width:100%" data-act="rel-meta">Mudar meta do mês</button></section>';
    }
    var s = '<section class="credcard"><div class="cc-top"><span class="cc-ic">' + sv(ICO.mais) + '</span><div style="flex:1;min-width:0"><b>Crédito de horas</b>' +
      '<p class="meta">Escola, LDC, Construção e outras designações. Somam na meta, mas vão separados no relatório.</p></div><b class="cc-tot">' + fmtHM(R.cred) + '</b></div>';
    var ent = entradasCredito(relMes);
    if (!ent.length) s += '<p class="dica" style="margin:4px 0 2px">Nenhum crédito lançado neste mês.</p>';
    var grupos = {};
    ent.forEach(function (e) { (grupos[e.cat] = grupos[e.cat] || []).push(e); });
    Object.keys(grupos).forEach(function (cid) {
      var arr = grupos[cid], tot = arr.reduce(function (t, e) { return t + e.min; }, 0);

        arr.map(function (e) {
          var rot = e.iso ? diaSemana(e.iso) + ', ' + Number(e.iso.slice(8, 10)) + ' de ' + MES[Number(e.iso.slice(5, 7)) - 1] : 'Lançado no mês (sem dia)';
          return '<div class="cc-l"><button class="cc-dia"' + (e.iso ? ' data-act="rel-credito" data-dia="' + e.iso + '" data-cat="' + cid + '"' : '') + '>' + esc(rot) + '</button><span>' + fmtMin(e.min) + '</span>' +
            '<button class="cc-x" data-act="rel-cred-remover" data-dia="' + (e.iso || '') + '" data-cat="' + cid + '" aria-label="Remover crédito">✕</button></div>';
        }).join('') + '</div>';
    });
    s += '<button class="btn btn-cred" style="width:100%;margin-top:10px" data-act="rel-credito">+ Adicionar crédito</button></section>';
    return s;
  }

  function vRelatorio() {
    var pm = relMes.split('-').map(Number), ano = pm[0], mes = pm[1];
    var primeiro = new Date(ano, mes - 1, 1), inicioSemana = primeiro.getDay(), qtdDias = new Date(ano, mes, 0).getDate();
    var R = relResumo(relMes);
    var pct = R.alvo ? Math.min(100, Math.round(R.total * 100 / R.alvo)) : 0;
    var base = R.alvo || R.total || 1;
    var pc = Math.min(100, R.campo * 100 / base), pr = Math.max(0, Math.min(100 - pc, R.cred * 100 / base));

    s += '<div class="duo"><button class="btn" data-act="rel-campo">' + sv(ICO.relogio) + 'Horas de campo</button>' +

    for (var i = 0; i < inicioSemana; i++) s += '<span class="cel fora"></span>';
    var hj = hojeISO();

      s += '<button class="cel' + nivel + (p[0] === hj ? ' hoje' : '') + (p[0] > hj ? ' futuro' : '') + (p[2] ? ' tem-cred' : '') + '" data-act="rel-dia" data-dia="' + p[0] + '">' +

    s += cartaoCredito(R);

    var diasComServico = doMes.filter(function (p) { return p[1] > 0; }).length;
    s += '<div class="duo-cards"><div class="mini-card"><span class="meta">Estudos bíblicos</span><b>' + estudosDoMes(relMes) + '</b>' +
      '<div class="contador"><button type="button" data-act="rel-estudos-menos" aria-label="Menos um">−</button><button type="button" data-act="rel-estudos-mais" aria-label="Mais um">+</button></div></div>' +
      '<div class="mini-card"><span class="meta">Dias no campo</span><b>' + diasComServico + '</b><button class="btn ghost mini" data-act="abrir-mensagem-mes">Enviar relatório</button></div></div>';

    if (R.cod === 'regular') {

  /* ---- folha do dia: o que foi lançado (campo + créditos) ---- */

  function gravaDiaRel(iso, minutos, creditos, nota) {

  /* ---- Revisitas ---- */

  function diasAte(iso) {

  /* ---------- backup ---------- */
  function baixaJSON(obj, nome) {
    var b = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function pedeArquivo(cb) {
    var i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { cb(JSON.parse(r.result)); } catch (e) { toast('Arquivo não reconhecido.'); } };
      r.readAsText(f);
    };
    i.click();

  function docPayload() { return { marcador: D.marcador, progresso: D.progresso, relatorio: D.relatorio, revisitas: D.revisitas, estudos: D.estudos, notas: D.notas, listas: D.listas, lembretes: D.lembretes, compromissos: D.compromissos, atualizadoEm: agoraMs() }; }
  function mesclarProgresso(local, remoto) {
    var m = {};
    Object.keys(local || {}).forEach(function (k) { m[k] = local[k].slice(); });
    Object.keys(remoto || {}).forEach(function (k) {
      var atual = m[k] || [];
      (remoto[k] || []).forEach(function (c) { if (atual.indexOf(c) < 0) atual.push(c); });
      m[k] = atual;
    });
    return m;
  }
  function mesclarArr(local, remoto) {
    var m = {};
    [].concat(local || [], remoto || []).forEach(function (o) {
      if (!o || !o.id) return;
      var a = m[o.id];
      if (!a || (o.updatedAt || 0) >= (a.updatedAt || 0)) m[o.id] = o;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  function aplicarRemoto(remote) {
    if (!remote) return;
    if (remote.marcador && (remote.marcador.quando || 0) > (D.marcador.quando || 0)) D.marcador = remote.marcador;
    D.progresso = mesclarProgresso(D.progresso, remote.progresso);
    D.relatorio = mesclarArr(D.relatorio, remote.relatorio);
    D.revisitas = mesclarArr(D.revisitas, remote.revisitas);
    D.estudos = mesclarArr(D.estudos, remote.estudos);
    D.notas = mesclarArr(D.notas, remote.notas);
    D.listas = mesclarArr(D.listas, remote.listas);
    D.lembretes = mesclarArr(D.lembretes, remote.lembretes);
    D.compromissos = mesclarArr(D.compromissos, remote.compromissos);
  }
  function agendarSync() {
    if (!FIREBASE_OK || !auth || !auth.currentUser) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      if (empurrando) { empurrarDeNovo = true; return; }
      empurrando = true; statusNuvem('sincronizando…');
      dbFS.collection('meuministerio_usuarios').doc(auth.currentUser.uid).set(docPayload())
        .then(function () { statusNuvem('sincronizado', 'on'); })
        .catch(function () { statusNuvem('sem conexão', 'err'); })
        .then(function () { empurrando = false; if (empurrarDeNovo) { empurrarDeNovo = false; agendarSync(); } });
    }, 700);
  }
  function ligarOuvinte(uidUser) {
    if (fsUnsub) { fsUnsub(); fsUnsub = null; }
    fsUnsub = dbFS.collection('meuministerio_usuarios').doc(uidUser).onSnapshot(function (snap) {
      if (!snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return;
      var remote = snap.data(); if (!remote) return;
      var antes = JSON.stringify(docPayload());
      aplicarRemoto(remote);
      if (JSON.stringify(docPayload()) !== antes) { salva(); render(); }
      statusNuvem('sincronizado', 'on');
    }, function () { statusNuvem('sem conexão', 'err'); });
  }

      'auth/user-not-found': 'Não encontramos uma conta com este e-mail.',

      'auth/popup-closed-by-user': 'Login cancelado.', 'auth/network-request-failed': 'Sem conexão com a internet.'

          if (snap.exists) { aplicarRemoto(snap.data()); salva(); render(); }

  function pedePermissao() {
    if (!window.Notification) { toast('Este navegador não mostra avisos.'); return; }
    if (Notification.permission === 'granted') { toast('Avisos já estão ligados.'); return; }

  }
  function avisarRevisitas() {

    setTimeout(function () { toast(v.length + ' revisita(s) esperando retorno: ' + nomes + '.'); }, 1200);
    try {

      }

  var lemFiltro = 'hoje';

  function agoraLocal() { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
  function lemPendentesHoje() { var h = hojeISO(); return D.lembretes.filter(function (l) { return !l.feito && l.quando && l.quando.slice(0, 10) <= h; }).length; }
  function cardLembrete(l) {
    var atras = !l.feito && l.quando && l.quando < agoraLocal();
    var info = [l.quando ? rotuloDia(l.quando.slice(0, 10)) : 'Sem data', l.repetir && REPET[l.repetir] ? '↻ ' + REPET[l.repetir] : '', atras ? 'atrasado' : ''].filter(Boolean).join(' · ');

  function vLembretes() {
    var h = hojeISO(), pend = lemPendentesHoje();
    var s = topoV(pend ? pend + ' para hoje' : 'Tudo em dia', 'Lembretes', icoBtn('novo-lembrete', ICO.mais, 'Novo lembrete'));
    var perm = (window.Notification && Notification.permission) || 'default';
    if (perm !== 'granted' && D.lembretes.length) s += '<div class="aviso"><p>Ligue os avisos para o celular tocar na hora marcada.</p><button class="btn mini" data-act="permitir">Ligar</button></div>';
    if (!D.lembretes.length) return s + vazio('Nenhum lembrete', 'Reunião, visita marcada, entrega de relatório — marque a data e o aparelho avisa.', 'Criar lembrete', 'novo-lembrete');
    s += '<div class="segm">' + [['hoje', 'Hoje'], ['semana', 'Semana'], ['todos', 'Todos']].map(function (x) {

    }).join('') + '</div>';

    var dentro = function (l) {
      if (lemFiltro === 'todos') return true;

      return lemFiltro === 'hoje' ? d <= 0 : d <= 7;
    };
    var abertos = D.lembretes.filter(function (l) { return !l.feito && dentro(l); }).sort(porHora);
    var atras = abertos.filter(function (l) { return l.quando && l.quando.slice(0, 10) < h; });
    var deHoje = abertos.filter(function (l) { return l.quando && l.quando.slice(0, 10) === h; });
    var prox = abertos.filter(function (l) { return l.quando && l.quando.slice(0, 10) > h; });
    var semData = abertos.filter(function (l) { return !l.quando; });
    if (atras.length) s += '<p class="grupo alerta">Atrasados · ' + atras.length + '</p>' + atras.map(cardLembrete).join('');
    if (deHoje.length || lemFiltro === 'hoje') s += '<p class="grupo">Hoje</p>' + (deHoje.length ? deHoje.map(cardLembrete).join('') : '<p class="dica">Nada marcado para hoje.</p>');

      '</div></article>';
  }
  function doDiaAgenda(iso) {
    var s = '';
    D.estudos.filter(function (e) { return e.data === iso; }).forEach(function (e) { s += cardEstudo(e); });
    D.revisitas.filter(function (r) { return r.retorno === iso; }).forEach(function (r) { s += cardRevisita(r); });
    D.compromissos.filter(function (c) { return c.data === iso; }).forEach(function (c) {
      return s += '<article class="cartao" data-act="abrir-compromisso" data-id="' + c.id + '">' +
        '<div class="cartao-txt"><h3>' + esc(c.titulo || 'Sem título') + '</h3><p class="meta">' + esc(c.tipo || 'compromisso') + '</p></div></article>';
    });
    if (!s) s += '<div class="vazio compacto"><p>Dia livre.</p><div class="linha-acoes"><button class="chip" data-act="nova-revisita">Nova revisita</button><button class="chip" data-act="novo-estudo">Novo estudo</button><button class="chip" data-act="novo-compromisso">Marcar compromisso</button></div></div>';
    return s;
  }
  function editorCompromisso(id) {
    var c = id ? byId(D.compromissos, id) : { id: uid(), data: diaAgenda, titulo: '', tipo: 'Reunião', nota: '' };
    if (!c) return;
    var corpo = '<div class="form">' + campo('Título', '<input type="text" data-f="titulo" placeholder="Ex.: Reunião de meio de semana" value="' + esc(c.titulo) + '">') +
      '<div class="dupla">' + campo('Data', '<input type="date" data-f="data" value="' + esc(c.data) + '">') +
      campo('Tipo', '<select data-f="tipo">' + ['Reunião', 'Assembleia', 'Congresso', 'Pessoal', 'Outro'].map(function (t) { return '<option' + (t === c.tipo ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>') + '</div>' +
      campo('Detalhe', '<textarea data-f="nota" rows="3">' + esc(c.nota) + '</textarea>') + '</div>';
    abreFolha(id ? 'Compromisso' : 'Novo compromisso', corpo, (id ? '<button class="btn ghost perigo" id="excluir-comp">Excluir</button>' : '') + '<button class="btn ghost" data-fechar>Fechar</button><button class="btn" id="salvar-comp">Salvar</button>');
    $('#salvar-comp').onclick = function () {
      $('#folha').querySelectorAll('[data-f]').forEach(function (i) { c[i.dataset.f] = i.value; });
      if (!c.titulo.trim()) { toast('Dê um nome ao compromisso.'); return; }
      c.updatedAt = agoraMs();
      if (!byId(D.compromissos, c.id)) D.compromissos.push(c);
      salva(); fechaFolha(); render(); toast('Compromisso salvo.');
    };
    var ex = $('#excluir-comp');
    if (ex) ex.onclick = function () { pergunta('Excluir este compromisso?', function () { D.compromissos = D.compromissos.filter(function (x) { return x.id !== c.id; }); salva(); fechaFolha(); render(); }); };
  }

  /* =======================================================================
     EVENTOS
     ======================================================================= */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-vista]'); if (b) { irPara(b.dataset.vista); return; }
    if (ev.target.closest('[data-fechar]')) { fechaFolha(); return; }
    if ($('#folha').classList.contains('open') && ev.target === $('#folha')) { fechaFolha(); return; }
    var a = ev.target.closest('[data-act]'); if (!a) return;
    var id = a.dataset.id, act = a.dataset.act;

    switch (act) {
      case 'ajustes': abreAjustes(); break;
      case 'busca': abreBusca(); break;
      case 'editar-nome': editorNome(); break;
      case 'dia': irPara('agenda'); diaAgenda = a.dataset.dia; { var pdD = a.dataset.dia.split('-').map(Number); mesAgenda = { a: pdD[0], m: pdD[1] - 1 }; } render(); break;
      case 'agenda-mes': { mesAgenda.m += Number(a.dataset.d); if (mesAgenda.m < 0) { mesAgenda.m = 11; mesAgenda.a--; } if (mesAgenda.m > 11) { mesAgenda.m = 0; mesAgenda.a++; } render(); break; }
      case 'novo-compromisso': fechaFolha(); editorCompromisso(null); break;
      case 'abrir-compromisso': editorCompromisso(id); break;
      case 'excluir-compromisso': pergunta('Excluir este compromisso?', function () { D.compromissos = D.compromissos.filter(function (x) { return x.id !== id; }); salva(); render(); }); break;
      case 'novo-lembrete': fechaFolha(); editorLembrete(null); break;
      case 'abrir-lembrete': editorLembrete(id); break;
      case 'lembrete-toggle': { var lt = byId(D.lembretes, id); lt.feito = !lt.feito; lt.updatedAt = agoraMs(); salva(); render(); break; }
      case 'ir-revisitas': irPara('revisitas'); break;
      case 'ir-ministerio': irPara({ relatorio: 'relatorio', revisitas: 'revisitas', estudo: 'estudos' }[a.dataset.aba] || 'relatorio'); break;
      case 'lem-filtro': lemFiltro = a.dataset.f; render(); break;

      case 'abrir-livro': abrirLivro(a.dataset.livro); break;
      case 'fechar-livro': bibliaLivroAtual = null; render(); break;
      case 'abrir-capitulo': abreAcaoCapitulo(a.dataset.livro, Number(a.dataset.cap)); break;
      case 'continuar-leitura': continuarLeitura(); break;

      case 'rel-mes': { var pmm = relMes.split('-').map(Number); var dtm = new Date(pmm[0], pmm[1] - 1 + Number(a.dataset.d), 1); relMes = dtm.getFullYear() + '-' + String(dtm.getMonth() + 1).padStart(2, '0'); render(); break; }
      case 'ir-mes-relatorio': relMes = a.dataset.mes; render(); break;
      case 'rel-dia': folhaDiaRel(a.dataset.dia); break;
      case 'rel-campo': fechaFolha(); editorCampo(a.dataset.dia || null); break;
      case 'rel-credito': fechaFolha(); editorCredito(a.dataset.dia || null, a.dataset.cat || null); break;
      case 'rel-meta': folhaMetaRel(false); break;
      case 'rel-set-meta': {
        var codM = a.dataset.meta || ''; relAtualizaConfig({ meta: codM }); fechaFolha(); render();
        var mM = METAS.filter(function (m) { return m[0] === codM; })[0] || ['', 'Sem meta'];
        toast(codM ? 'Meta: ' + mM[1].split(' — ')[0] + (metaTemCredito(codM) ? ' · crédito de horas liberado' : '') : 'Meta desligada.');
        break;
      }
      case 'rel-cred-remover': {
        var diaC = a.dataset.dia, catC = a.dataset.cat;
        pergunta('Remover este crédito de ' + relNomeCategoria(catC) + '?', function () {
          if (diaC) removeCreditoDia(diaC, catC);
          else relSalva({ id: idCredMes(catC, relMes), del: true, updatedAt: agoraMs() });
          render(); toast('Crédito removido.');
        }, 'Remover');
        break;
      }
      case 'lc-modo':
        lcCaptura();
        if (a.dataset.v === 'cred' && !credLiberado()) { folhaMetaRel(true); break; }
        if (relTmp.modo !== a.dataset.v) { relTmp.modo = a.dataset.v; if (relTmp.modo === 'cred') lcPreencheCred(false); else lcPreencheCampo(); desenhaLancamento(); }
        break;
      case 'lc-cat': lcCaptura(); relTmp.cat = a.dataset.v; lcPreencheCred(true); desenhaLancamento(); break;
      case 'lc-h': lcCaptura(); relTmp.h = Math.max(0, Math.min(24, relTmp.h + Number(a.dataset.d))); desenhaLancamento(); break;
      case 'lc-m': lcCaptura(); relTmp.m = Number(a.dataset.v); desenhaLancamento(); break;
      case 'lc-salvar': lcCaptura(); lcSalvar(); break;
      case 'lc-remover': lcCaptura(); lcRemover(); break;
      case 'rel-cred-toggle': { var catsA = relCatsAtivas(), cidT = a.dataset.cat; var novasC = catsA.indexOf(cidT) >= 0 ? catsA.filter(function (x) { return x !== cidT; }) : catsA.concat([cidT]); relAtualizaConfig({ credCats: novasC }); render(); break; }
      case 'rel-estudos-menos': relMudaEstudos(-1); break;
      case 'rel-estudos-mais': relMudaEstudos(1); break;
      case 'abrir-mensagem-mes': abreMensagemMes(); break;
      case 'copiar-mensagem-mes': copiarMensagemMes(); break;
      case 'enviar-mensagem-mes': enviarMensagemMes(); break;

      case 'nova-revisita': fechaFolha(); editorRevisita(null); break;
      case 'abrir-revisita': editorRevisita(id); break;
      case 'rev-filtro': revFiltro = a.dataset.f; render(); break;
      case 'voltou-hoje': voltouHoje(id); break;
      case 'adiar-revisita': adiarRevisita(id, 7); break;
      case 'novo-estudo': fechaFolha(); editorEstudo(null); break;
      case 'abrir-estudo': editorEstudo(id); break;
      case 'est-obs': {
        editorEstudo(id); acrescentarObsEstudo();
        var obsIn = $$('#est-obs-lista [data-obs-texto]'); var ultIn = obsIn[obsIn.length - 1];
        if (ultIn) { try { ultIn.scrollIntoView({ block: 'center' }); ultIn.focus(); } catch (e) { } }
        break;
      }
      case 'est-ponto': {
        var eP = byId(D.estudos, id); if (!eP) break;
        eP.ponto = String((Number(eP.ponto) || 0) + 1); eP.updatedAt = agoraMs(); salva(); render();
        toast((eP.nome || 'Estudo').split(' ')[0] + ': agora no ponto ' + eP.ponto + '.');
        break;
      }
      case 'obs-add': acrescentarObsEstudo(); break;
      case 'obs-remover': removerObsEstudo(Number(a.dataset.ix)); break;

      case 'nova-nota': fechaFolha(); editorNota(null); break;
      case 'abrir-nota': editorNota(id); break;

      case 'nova-lista': D.listas.unshift({ id: uid(), titulo: 'Nova lista', itens: [], updatedAt: agoraMs() }); salva(); render(); break;
      case 'renomear-lista': {
        var l0 = byId(D.listas, id);
        abreFolha('Nome da lista', '<div class="form">' + campo('Título', '<input type="text" id="nome-lista" value="' + esc(l0.titulo) + '">') + '</div>',
          '<button class="btn ghost" data-fechar>Voltar</button><button class="btn" id="sv-lista">Salvar</button>');
        $('#sv-lista').onclick = function () { l0.titulo = $('#nome-lista').value || 'Lista'; l0.updatedAt = agoraMs(); salva(); fechaFolha(); render(); };
        break;
      }
      case 'excluir-lista': pergunta('Excluir esta lista inteira?', function () { D.listas = D.listas.filter(function (x) { return x.id !== id; }); salva(); render(); }); break;
      case 'item-toggle': { var li = byId(D.listas, id); li.itens[a.dataset.ix].feito = !li.itens[a.dataset.ix].feito; li.updatedAt = agoraMs(); salva(); render(); break; }
      case 'item-remover': { var lr = byId(D.listas, id); lr.itens.splice(Number(a.dataset.ix), 1); lr.updatedAt = agoraMs(); salva(); render(); break; }
      case 'item-editar': {
        var le = byId(D.listas, id), ix = Number(a.dataset.ix);
        abreFolha('Item', '<div class="form">' + campo('Texto', '<input type="text" id="it-txt" value="' + esc(le.itens[ix].txt) + '">') + '</div>',
          '<button class="btn ghost" data-fechar>Voltar</button><button class="btn" id="sv-it">Salvar</button>');
        $('#sv-it').onclick = function () { le.itens[ix].txt = $('#it-txt').value; le.updatedAt = agoraMs(); salva(); fechaFolha(); render(); };
        break;
      }

      case 'ordem': abreOrdem(); break;
      case 'ordem-sobe': moveAba(a.dataset.k, -1); break;
      case 'ordem-desce': moveAba(a.dataset.k, 1); break;
      case 'ordem-padrao': D.cfg.ordem = ORDEM_PADRAO.slice(); salva(); montaNav(); irPara(vistaAtual); abreOrdem(); break;
      case 'permitir': pedePermissao(); break;

      case 'exportar-tudo': baixaJSON({ tipo: 'meuministerio-backup', versao: 1, data: new Date().toISOString(), dados: D }, 'ministerio-copia-' + hojeISO() + '.json'); toast('Cópia salva.'); break;
      case 'importar-tudo': pedeArquivo(function (o) {
        pergunta('Importar substitui os dados deste aparelho pelos do arquivo. Continuar?', function () {
          if (o && o.dados) D = o.dados; carrega(); aplicaCfg(); montaNav(); salva(); irPara(vistaAtual); toast('Cópia importada.');
        }, 'Importar');
      }); break;
      case 'limpar': pergunta('Isso apaga revisitas, estudos, notas, listas, lembretes, agenda e o relatório deste aparelho. Tem certeza?', function () {
        var cfg = D.cfg; D = padrao(); D.cfg = cfg; salva(); irPara(vistaAtual); toast('Dados apagados deste aparelho.');
      }, 'Apagar tudo'); break;
    }
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('.add-item'); if (!f) return;
    ev.preventDefault();
    var l = byId(D.listas, f.dataset.id); var inp = f.querySelector('input');
    var txt = (inp.value || '').trim(); if (!txt) return;
    l.itens.push({ txt: txt, feito: false }); l.updatedAt = agoraMs();
    salva(); render();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q-biblia') {
      bibliaFiltro = ev.target.value; var pos = ev.target.selectionStart;
      render();
      var n = $('#q-biblia'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'rel-meta') {
      relAtualizaConfig({ meta: t.value }); render();
      var nomeMeta = (METAS.filter(function (m) { return m[0] === t.value; })[0] || ['', 'Sem meta'])[1];
      toast(t.value ? 'Meta ativa: ' + nomeMeta : 'Meta desligada.');
      return;
    }
    if (t.id === 'rel-estudos') { relSalvaEstudos(t.value); render(); return; }
    if (t.id === 'rel-cred-nome') { relAtualizaConfig({ credNomeOutro: t.value }); render(); return; }
    if (t.id && t.id.indexOf('rel-credh-') === 0) { relSalvaCredito(t.id.slice('rel-credh-'.length)); return; }
    if (t.id && t.id.indexOf('rel-credm-') === 0) { relSalvaCredito(t.id.slice('rel-credm-'.length)); return; }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fechaFolha(); });

  /* =======================================================================
     PARTIDA
     ======================================================================= */
  var iniciado = false;
  function iniciar() {
    if (iniciado) return; iniciado = true;
    carrega(); aplicaCfg(); montaNav();
    irPara('relatorio');
    avisarRevisitas();
    agendaAvisos();
    checaAtrasados();
    atalhoDaUrl();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) agendaAvisos(); });
  }
  function atalhoDaUrl() {
    var m = (location.search || '').match(/acao=([a-z\-]+)/);
    if (!m) return;
    var acao = m[1];
    if (history.replaceState) history.replaceState(null, '', location.pathname);
    setTimeout(function () {
      if (acao === 'nova-revisita') { irPara('revisitas'); editorRevisita(null); }
      else if (acao === 'novo-estudo') { irPara('estudos'); editorEstudo(null); }
      else if (acao === 'nova-nota') { irPara('notas'); editorNota(null); }
      else if (acao === 'relatorio') irPara('relatorio');
      else if (acao === 'lancar-horas') { irPara('relatorio'); editorCampo(hojeISO()); }
      else if (acao === 'biblia') irPara('biblia');
      else if (acao === 'novo-lembrete') { irPara('lembretes'); editorLembrete(null); }
      else if (acao === 'agenda') irPara('agenda');
    }, 260);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(iniciar, 0);
  else document.addEventListener('DOMContentLoaded', iniciar);

  window.Ministerio = { dados: function () { return D; }, salvar: salva, ir: irPara, aviso: toast };
})();
</script>

<script>
/* ==========================================================================
   Botão de voltar do celular — mesma lógica do Planejar:
   camadas (folha/leitura) fecham primeiro; depois volta pela trilha de
   telas; no fim, volta ao Relatório; já no Relatório, exige um segundo
   toque para sair do app.
   ========================================================================== */
(function () {
  'use strict';
  var CAMADAS = ['leitura', 'folha'];
  var pilha = [];
  var ignorar = 0;
  var voltando = false;
  var avisoSaida = 0;
  var vistaAtual = null;

  function empilha(item) { pilha.push(item); try { history.pushState({ mm: pilha.length }, ''); } catch (e) { } }
  function retira(tipo, id) {
    for (var i = pilha.length - 1; i >= 0; i--) {
      if (pilha[i].tipo === tipo && pilha[i].id === id) {
        pilha.splice(i, 1); ignorar++;
        try { history.back(); } catch (e) { ignorar--; }
        return;
      }
    }
  }
  function guarda() { try { history.pushState({ mm: 0 }, ''); } catch (e) { } }

  function fechaCamada(id) {
    var alvo = id === 'leitura' ? document.querySelector('#sair-leitura') : document.querySelector('#folha [data-fechar]');
    if (alvo) { alvo.click(); return; }
    var el = document.getElementById(id);
    if (el) el.classList.remove('open');
    if (!document.querySelector('#folha.open, #leitura.open')) document.body.classList.remove('travado');
  }
  function vigia(id) {
    var el = document.getElementById(id); if (!el) return;
    var aberto = el.classList.contains('open');
    new MutationObserver(function () {
      var agora = el.classList.contains('open');
      if (agora === aberto) return;
      aberto = agora;
      if (agora) empilha({ tipo: 'camada', id: id }); else retira('camada', id);
    }).observe(el, { attributes: true, attributeFilter: ['class'] });
  }
  CAMADAS.forEach(vigia);

  function vistaDaNav() { var n = document.getElementById('nav'); return n && n.dataset.vista ? n.dataset.vista : null; }
  var SUBS = ['biblia', 'notas', 'listas', 'agenda'];
  var nav = document.getElementById('nav');
  if (nav) {
    vistaAtual = vistaDaNav();
    new MutationObserver(function () {
      var nova = vistaDaNav();
      if (!nova || nova === vistaAtual) return;
      var de = vistaAtual; vistaAtual = nova;
      if (!voltando && de) empilha({ tipo: 'vista', de: de });
    }).observe(nav, { attributes: true, attributeFilter: ['data-vista'] });
  }
  function vaiPara(v) { voltando = true; if (window.Ministerio && window.Ministerio.ir) window.Ministerio.ir(v); setTimeout(function () { voltando = false; }, 0); }

  function fimDaPilha() {
    if (vistaAtual && SUBS.indexOf(vistaAtual) >= 0) { guarda(); vaiPara('mais'); return; }
    if (vistaAtual && vistaAtual !== 'relatorio') { guarda(); vaiPara('relatorio'); return; }
    if (Date.now() - avisoSaida < 2500) { try { history.back(); } catch (e) { } return; }
    avisoSaida = Date.now();
    if (window.Ministerio && window.Ministerio.aviso) window.Ministerio.aviso('Toque em voltar de novo para sair.');
    guarda();
  }
  window.addEventListener('popstate', function () {
    if (ignorar > 0) { ignorar--; return; }
    var item = pilha.pop();
    if (!item) { fimDaPilha(); return; }
    if (item.tipo === 'camada') fechaCamada(item.id); else vaiPara(item.de);
  });
  function liga() { vistaAtual = vistaDaNav() || vistaAtual; guarda(); }
  if (document.readyState === 'complete') setTimeout(liga, 0);
  else window.addEventListener('load', function () { setTimeout(liga, 0); });
})();
</script>

<script>
/* Instalação e atualização do app */
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nova = reg.installing;
        if (!nova) return;
        nova.addEventListener('statechange', function () {
          if (nova.state === 'installed' && navigator.serviceWorker.controller) {
            var aviso = window.Ministerio && window.Ministerio.aviso;
            if (aviso) aviso('Nova versão pronta.', 'Atualizar', function () { nova.postMessage('atualizar-agora'); });
          }
        });
      });
    }).catch(function () { });
    var recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recarregou) return; recarregou = true; location.reload();
    });
  });
})();
(function () {
  var convite = null;
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault(); convite = ev;
    setTimeout(function () {
      var aviso = window.Ministerio && window.Ministerio.aviso;
      if (!convite || !aviso) return;
      aviso('Dá para instalar o Meu Ministério no celular.', 'Instalar', function () { convite.prompt(); convite = null; });
    }, 4000);
  });
  window.addEventListener('appinstalled', function () { convite = null; });
})();
</script>
